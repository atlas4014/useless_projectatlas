<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify You Are Human</title>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
:root{
    --bg:#e9e7e3;
    --card-bg:#faece4;
    --card-border:#f3ddd0;
    --ink:#14120f;
    --muted:#74787f;
    --accent-amber:#b8763f;
    --accent-blue:#52709c;
    --nav-black:#0d0d0d;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-mono: 'Courier New', ui-monospace, SFMono-Regular, monospace;
}
body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    gap: 20px;
}
.eyebrow{
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--muted);
}
.eyebrow b{ color: var(--accent-amber); font-weight:700; }
.captcha-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(20,18,15,0.06);
    padding: 20px 24px;
    position: fixed;
    z-index: 10;
    transition: left 400ms ease, top 400ms ease;
}
#resultMsg {
    font-family: var(--font-mono);
    font-weight: bold;
    min-height: 20px;
    color: var(--ink);
}
button {
    font-family: var(--font-mono);
    font-weight: 700;
    padding: 10px 24px;
    font-size: 15px;
    letter-spacing: .02em;
    color: #fff;
    background: var(--nav-black);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 20;
    transition: opacity .15s ease;
}
button:hover{ opacity: .85; }
</style>
</head>
<body>

<div class="eyebrow">VERIFY_<b>HUMAN</b></div>

<div class="captcha-card">
<div class="h-captcha"
    data-sitekey="79a086d4-e5a2-49b4-b0ae-d75a2b28efce"
    data-callback="onCaptchaVerified"></div>
</div>

<button id="submitBtn">Submit</button>
<div id="resultMsg"></div>

<script>
const captchaCard = document.querySelector('.captcha-card');
const submitButton = document.getElementById('submitBtn');
const resultMsg = document.getElementById('resultMsg');
const maxMoves = 2;
let moveCount = 0;

function moveCaptcha() {
    const cardWidth = captchaCard.offsetWidth;
    const cardHeight = captchaCard.offsetHeight;
    const margin = 16;
    const maxLeft = Math.max(margin, window.innerWidth - cardWidth - margin);
    const maxTop = Math.max(margin, window.innerHeight - cardHeight - margin);
    const buttonRect = submitButton.getBoundingClientRect();

    function overlapsButton(left, top) {
        return left < buttonRect.right + margin &&
            left + cardWidth > buttonRect.left - margin &&
            top < buttonRect.bottom + margin &&
            top + cardHeight > buttonRect.top - margin;
    }

    for (let attempt = 0; attempt < 100; attempt += 1) {
        const left = Math.floor(Math.random() * (maxLeft - margin + 1)) + margin;
        const top = Math.floor(Math.random() * (maxTop - margin + 1)) + margin;

        if (!overlapsButton(left, top)) {
            captchaCard.style.left = `${left}px`;
            captchaCard.style.top = `${top}px`;
            return;
        }
    }

    captchaCard.style.left = `${margin}px`;
    captchaCard.style.top = `${margin}px`;
}

window.onCaptchaVerified = () => {
    moveCount += 1;
    resultMsg.style.color = '#080';
    resultMsg.textContent = `Not Verified.`;
    moveCaptcha();

    if (moveCount < maxMoves) {
        hcaptcha.reset();
    } else {
        resultMsg.textContent = 'Verified. You have completed the Easy captcha successfully!';
    }
};

document.getElementById('submitBtn').addEventListener('click', () => {
    const token = document.querySelector('textarea[name="h-captcha-response"]')?.value;

    if (!token) {
        resultMsg.style.color = '#c00';
        resultMsg.textContent = 'Please complete the captcha first.';
    }
});
</script>

</body>
</html>
